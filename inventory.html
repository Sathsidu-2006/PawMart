<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FashionRack | Inventory</title>
    <link rel="icon" type="image/png" href="assets/logof.png">
    <link rel="stylesheet" href="css/inventory.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
</head>

<body>
    <section id="main-section">
        <div class="main">
            <div class="left-container">
                <div class="img-container">
                    <img src="assets/logof.png" alt="" class="logo">
                </div>

                <div class="list-container">
                    <ul>
                        <li><span class="heading">Dashboard</span></li>
                        <li><a href="index.html"><i class='bx bx-home-alt'></i> Overview</a></li>
                        <li></i><a href="index.html#inventory-section"><i class='bx bx-cart'></i> Point of Sale</a></li>

                        <li><span class="heading">Management</span></li>
                        <li><a href="inventory.html"><i class='bx bx-package'></i> Inventory</a></li>
                        <li><a href="supplier.html"><i class='bx bx-user'></i> Suppliers</a></li>

                        <li><span class="heading">Business</span></li>
                        <li><a href="reports.html"><i class='bx bx-bar-chart-alt-2'></i> Reports</a></li>
                        

                    </ul>
                </div>
            </div>


            <div class="right-container">
                <div class="crud-grid">

                    <!-- 1. Add Product Card -->
                    <div class="crud-card">
                        <h3 class="crud-title">Add Product</h3>
                        <div class="add-img-container">
                            <label for="add-img">Select Product Image :</label>
                            <input type="file" id="add-img" accept="image/*" required>
                        </div>

                        <form action="" class="product-form">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="add-id">Product ID</label>
                                    <input type="text" id="add-id" placeholder="e.g : PTS0001">
                                </div>

                                <div class="form-group">
                                    <label for="add-name">Product Name</label>
                                    <input type="text" id="add-name" placeholder="Oversized Tee">
                                </div>

                                <div class="form-group">
                                    <label for="add-price">Price</label>
                                    <input type="text" id="add-price" placeholder="$28.00">
                                </div>

                                <div class="form-group">
                                    <label for="add-size">Size</label>
                                    <input type="text" id="add-size" placeholder="Medium">
                                </div>

                                <div class="form-group">
                                    <label for="add-type">Type</label>
                                    <input type="text" id="add-type" placeholder="T-Shirt">
                                </div>

                                <div class="form-group">
                                    <label for="add-qty">Quantity</label>
                                    <input type="text" id="add-qty" placeholder="45">
                                </div>

                                <div class="form-group">
                                    <label for="add-img-url">Image URL</label>
                                    <input type="text" id="add-img-url" placeholder="assets/tee.jpg">
                                </div>

                                <div class="form-group full-span">
                                    <label for="add-detail">Product Detail</label>
                                    <input type="text" id="add-detail" placeholder="Short description of the item">
                                </div>
                            </div>

                            <button type="submit" class="submit-btn btn-add" onclick="addProduct(event)">Add Product</button>
                        </form>
                    </div>

                    <!-- 2. Update Product Card -->
                    <div class="crud-card">
                        <h3 class="crud-title">Update Product</h3>
                        <div class="add-img-container">
                            <label for="add-img">Select Product Image :</label>
                            <input type="file" id="add-img" accept="image/*" required>
                        </div>

                        <form action="" class="product-form">
                            <div class="form-grid">
                                <div class="form-group full-span">
                                    <label for="update-id">Product ID / Name</label>
                                    <input type="text" id="update-id" placeholder="Enter ID or name to update">
                                </div>

                                <div class="form-group">
                                    <label for="update-price">New Price</label>
                                    <input type="text" id="update-price" placeholder="$32.00">
                                </div>

                                <div class="form-group">
                                    <label for="update-qty">New Quantity</label>
                                    <input type="text" id="update-qty" placeholder="60">
                                </div>

                                <div class="form-group">
                                    <label for="update-size">New Size</label>
                                    <input type="text" id="update-size" placeholder="Large">
                                </div>

                                <div class="form-group">
                                    <label for="update-type">New Type</label>
                                    <input type="text" id="update-type" placeholder="Hoodie">
                                </div>

                                <div class="form-group full-span">
                                    <label for="update-detail">Updated Detail</label>
                                    <input type="text" id="update-detail" placeholder="Updated description">
                                </div>
                            </div>

                            <input type="submit" value="Update Product" class="submit-btn btn-update" onclick="updateProduct(event)">
                        </form>
                    </div>

                    <!-- 3. Delete Product Card -->
                    <div class="crud-card">
                        <h3 class="crud-title">Delete Product</h3>
                        <div class="add-img-container">
                            <label for="add-img">Select Product Image :</label>
                            <input type="file" id="add-img" accept="image/*" required></p>
                        </div>

                        <form action="" class="product-form">
                            <div class="form-grid">
                                <div class="form-group full-span">
                                    <label for="delete-id">Product ID / Name</label>
                                    <input type="text" id="delete-id" placeholder="Enter ID or product name">
                                </div>

                                <div class="form-group full-span">
                                    <label for="delete-reason">Reason (Optional)</label>
                                    <input type="text" id="delete-reason" placeholder="Discontinued / Sold out">
                                </div>
                            </div>

                            <input type="submit" value="Delete Product" class="submit-btn btn-delete">
                        </form>
                    </div>
                </div>

            </div>
    </section>

    <section id="inventory-section">

        <div class="add-inventory-container">

            

        </div>
    </section>

    <script src="js/app.js"></script>
</body>

</html>
